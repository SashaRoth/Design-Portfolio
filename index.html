<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--
  HUB PAGE
  ---------
  Five "node" links are arranged around the center bio card using
  the --x / --y custom properties set inline on each .node element
  (percentages within the 900x900 .web box). To rearrange topics,
  just swap the --x/--y pairs, the SVG line endpoints, and the
  href/label/icon inside each node. Each node also sets its own
  --node-accent, matching that destination page's theme color —
  update it if you change a page's palette in css/style.css.

  To replace an icon: swap the <img src="images/cat.png"> for your
  own square image (ideally 200x200px or larger, it gets cropped
  into a circle).
-->

<main class="hub">
  <div class="web">

    <!-- connecting lines + faint orbit ring, purely decorative -->
    <svg class="web-lines" viewBox="0 0 900 900" aria-hidden="true">
      <g class="orbit-group">
        <circle class="orbit" cx="450" cy="450" r="380"></circle>
      </g>
      <line x1="450" y1="450" x2="450"   y2="70"></line>
      <line x1="450" y1="450" x2="811.5" y2="332.5"></line>
      <line x1="450" y1="450" x2="673.4" y2="757.4"></line>
      <line x1="450" y1="450" x2="226.6" y2="757.4"></line>
      <line x1="450" y1="450" x2="88.5"  y2="332.5"></line>
    </svg>

    <!-- center: photo + bio -->
    <div class="bio-card">
      <div class="portrait">
        <img src="images/cat.png" alt="Portrait of you">
      </div>
      <h1>Your Name</h1>
      <p class="role">Engineer · Maker · Student</p>
      <p class="bio-text">
        Swap in a couple of sentences here — who you are, what you're
        studying, and what you like to build. Keep it short; the
        pages around this one do the rest of the talking.
      </p>
      <div class="bio-links">
        <a href="mailto:you@example.com">Email</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>

    <!-- nodes: order = top, upper-right, lower-right, lower-left, upper-left -->
    <a class="node" href="research.html" style="--x: 50%;    --y: 7.78%;  --delay: 0.05s; --node-accent: #3185FC;">
      <span class="icon-ring"><img src="images/cat.png" alt=""></span>
      <span class="label">Research &amp; Internship</span>
    </a>

    <a class="node" href="electronics.html" style="--x: 90.17%; --y: 36.94%; --delay: 0.15s; --node-accent: #B0FE76;">
      <span class="icon-ring"><img src="images/cat.png" alt=""></span>
      <span class="label">Electronics</span>
    </a>

    <a class="node" href="leadership.html" style="--x: 74.82%; --y: 84.16%; --delay: 0.25s; --node-accent: #C083C4;">
      <span class="icon-ring"><img src="images/cat.png" alt=""></span>
      <span class="label">Leadership</span>
    </a>

    <a class="node" href="academics.html" style="--x: 25.18%; --y: 84.16%; --delay: 0.35s; --node-accent: #D6684A;">
      <span class="icon-ring"><img src="images/cat.png" alt=""></span>
      <span class="label">Academics</span>
    </a>

    <a class="node" href="art.html" style="--x: 9.83%;  --y: 36.94%; --delay: 0.45s; --node-accent: #258EA6;">
      <span class="icon-ring"><img src="images/cat.png" alt=""></span>
      <span class="label">Art</span>
    </a>

  </div>
</main>

</body>
</html>
